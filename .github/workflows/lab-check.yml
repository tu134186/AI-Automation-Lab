name: Automation Lab Check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'scripts/**'
      - '.github/workflows/lab-check.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free smoke check
        run: python3 scripts/self_check.py
