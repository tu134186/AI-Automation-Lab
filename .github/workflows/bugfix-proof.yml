name: Bugfix proof
on:
  push:
    branches: ['test/bugfix-proof-20261029']
    paths: ['bugfix_demo/**', '.github/workflows/bugfix-proof.yml']
permissions:
  contents: read
concurrency:
  group: bugfix-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reproduce seeded bugs and verify fix
        run: python3 bugfix_demo/verify.py
      - name: Publish summary
        if: always()
        run: cat bugfix_demo/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bugfix-proof
          path: |
            bugfix_demo/report.md
            bugfix_demo/before.log
            bugfix_demo/after.log
          retention-days: 14
